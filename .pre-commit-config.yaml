# Local hooks run the tool versions pinned in uv.lock, so pre-commit and CI agree.
repos:
  - repo: local
    hooks:
      - id: block-secrets
        name: block API keys
        language: pygrep
        entry: '(sk-or-v1-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16})'
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        types: [python]
        files: ^src/
        pass_filenames: false

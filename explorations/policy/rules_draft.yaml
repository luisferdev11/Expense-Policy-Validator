  - employee_id
  - transaction_datetime
  - submitted_expense_type
  - currency
  - employee_country
  - attendee_count
  - line_items[].category
  - line_items[].amount_usd
  - total_amount_usd
  - itemized
  thresholds:
  - value: 75
    unit: USD
    basis: per person per day, domestic
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  - value: 100
    unit: USD
    basis: per person per day, international (receipt currency differs from home-country currency); the
      higher cap on a mixed day
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  carve_outs: []
  replaces: []
  literal_text: 'MEAL-01 — Daily meal cap. Meal spend is capped at $75 per person per day for domestic
    travel and $100 per person per day for international travel. Spend above the cap is a medium exception.
    For this rule:'
  notes: Emit on each contributing meal receipt of the breached day. APAC -> REG-02, EMEA -> REG-03.
  status: DRAFT

      EUR receipts)
  carve_outs: []
  replaces:
  - MEAL-01
  literal_text: REG-03 — Meal cap. The EMEA daily meal cap is EUR 70 per person, replacing both MEAL-01
    figures for EMEA employees. Convert EUR 70 to USD at the euro rate on the transaction date — for a
    euro receipt, that is the receipt's own rate — before comparing. Meal spend, per person and per day
    are defined as in MEAL-01. A breach is a medium exception, reported as REG-03, not MEAL-01.
  notes: ''
  status: DRAFT
- rule_id: REG-04
  policy_doc: regional-addendum.md
  severity: low
  scope: receipt
  triggers:
  - entity == EMEA and total_amount_usd > 50 * eur_usd(date) and vat_number is null
  required_fields:
  - entity
  - total_amount
  - currency
  - fx_rate_to_usd
  thresholds:
  - value: 50
    unit: EUR
    basis: receipt total
    conversion: EUR converted to USD at the euro rate on the transaction date (receipt's own rate for
      EUR receipts)
  carve_outs: []
  replaces: []
  literal_text: REG-04 — VAT documentation. Receipts above EUR 50 — converted at the euro rate on the
    transaction date for a receipt in another currency — must be valid VAT receipts showing the merchant
    VAT number. A missing VAT number is a low exception. Where the expense record does not capture a VAT
    number, treat it as missing.
  notes: ''
  status: DRAFT
- rule_id: REG-05
  policy_doc: regional-addendum.md
  severity: none
  scope: none
  triggers:
  - any comparison of a non-USD amount with a threshold
  required_fields:
  - fx_rate_to_usd
  - transaction_datetime
  thresholds: []
  carve_outs: []
  replaces: []
  literal_text: REG-05 — Conversion rate. Currency conversion uses the rate on the transaction date, which
    must be recorded on the expense record. REG-05 says which rate to use and raises nothing on its own;
    a missing rate is reported under DOC-04.
  notes: Rate definition; missing rate -> DOC-04.
  status: DRAFT
- rule_id: TECH-01
  policy_doc: technology-and-equipment-policy.md
  severity: high
  scope: line_items
  triggers:
  - line.category == personal_electronics
  required_fields:
  - line_items[].category
  thresholds: []
  carve_outs: []
  replaces: []
  literal_text: 'TECH-01 — Personal electronics are not reimbursable. This includes, and is not limited
    to: headphones and earbuds, smart watches and fitness trackers, tablets and e-readers, games consoles,
    cameras and drones, televisions, portable speakers, and item trackers. Accessories made for such a
    device — cases, chargers, screen protectors — count as personal electronics too. Purchase of any of
    these on an expense report is a high exception, regardless of stated business purpose.'
  notes: Purpose irrelevant; Computer Equipment declaration still fires.
  status: DRAFT
- rule_id: TECH-02
  policy_doc: technology-and-equipment-policy.md
  severity: medium
  scope: line_items
  triggers:
  - line.category == computer_accessory and unit_price * fx_rate_to_usd > 200 and ref kind != pre-approval
  required_fields:
  - line_items[].category
  - line_items[].unit_price
  - fx_rate_to_usd
  - pre_approval_ref
  thresholds:
  - value: 200
    unit: USD
    basis: unit price per item, not line total
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  carve_outs:
  - condition: pre-approval reference recorded
    reference_kind: pre-approval
  replaces: []
  literal_text: TECH-02 — Peripherals under $200. Computer accessories and peripherals — cables, adapters,
    docking stations, mice, keyboards, monitors, laptop stands, webcams — are reimbursable up to $200
    per item, judged on the item's unit price in USD. Any accessory or peripheral above $200 requires
    a pre-approval reference (see EXC-02); without one it is a medium exception.
  notes: ''
  status: DRAFT
- rule_id: TECH-03
  policy_doc: technology-and-equipment-policy.md
  severity: high
  scope: line_items
  triggers:
  - line is mobile phone hardware (category other)
  required_fields:
  - line_items[].description_raw
  - line_items[].category
  thresholds: []
  carve_outs: []
  replaces: []
  literal_text: TECH-03 — Mobile handsets. Mobile phone hardware is procured centrally by IT and is never
    reimbursable on an expense report. This is a high exception.
  notes: ''
  status: DRAFT
- rule_id: TECH-04
  policy_doc: technology-and-equipment-policy.md
  severity: low
  scope: line_items
  triggers:
  - line.category == software_subscription and ref kind != manager approval
  required_fields:
  - line_items[].category
  - pre_approval_ref
  thresholds: []
  carve_outs:
  - condition: manager approval recorded
    reference_kind: manager approval
  replaces: []
  literal_text: TECH-04 — Software subscriptions. Any software or SaaS subscription on an expense report
    requires a manager approval reference (see EXC-02). Without one this is a low exception.

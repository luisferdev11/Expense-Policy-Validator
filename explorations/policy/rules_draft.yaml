- rule_id: HEALTH-01
  policy_doc: non-reimbursable-items.md
  severity:
    otc_medication: low
    prescription_medication: medium
  scope: line_items
  triggers:
  - line.category == health_otc and trip_id is null
  - line.category == health_otc and sum(health_otc amount_usd over trip_id) > 25
  - line is prescription medication (category other) -> medium
  required_fields:
  - trip_id
  - line_items[].category
  - line_items[].amount_usd
  - line_items[].description_raw
  thresholds:
  - value: 25
    unit: USD
    basis: OTC total per trip, across receipts
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  carve_outs:
  - condition: OTC medication on a trip-linked receipt within the $25 trip total
    reference_kind: null
  replaces: []
  literal_text: HEALTH-01 — Over-the-counter medication. OTC medication is reimbursable only on a receipt
    linked to a trip, up to $25 in total across all of that trip's receipts. Above $25, or on a receipt
    with no trip record, it is a low exception, raised on each such receipt and citing its medication
    lines. Prescription medication is never reimbursable on an expense report and is a medium exception.
  notes: ''
  status: DRAFT

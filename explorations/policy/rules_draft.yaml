- rule_id: EXC-01
  policy_doc: approval-and-exception-handling.md
  severity: none
  scope: none
  triggers:
  - disposition = f(max severity of exceptions, any review signal)
  required_fields:
  - exceptions[].severity
  - review_signals
  thresholds: []
  carve_outs: []
  replaces: []
  literal_text: 'EXC-01 — Receipt disposition. A receipt''s disposition is determined by the most severe
    exception raised against it:'
  notes: critical|high|medium -> flag; low only or signals only -> review; none -> pass.
  status: DRAFT
- rule_id: EXC-02
  policy_doc: approval-and-exception-handling.md
  severity: none
  scope: none
  triggers:
  - rule requires a reference -> check pre_approval_ref and its kind
  required_fields:
  - pre_approval_ref
  thresholds: []
  carve_outs:
  - rule: TECH-02
    reference_kind: pre-approval
  - rule: ENT-01
    reference_kind: VP approval
  - rule: TECH-04
    reference_kind: manager approval
  - rule: PERS-01
    reference_kind: baggage-delay reference
  - rule: PERS-02
    reference_kind: baggage-delay reference
  replaces: []
  literal_text: 'EXC-02 — Approval references. Every approval or exception reference — a pre-approval,
    a VP or manager approval, or a baggage-delay reference — is recorded in one field on the expense (`pre_approval_ref`
    in the data). Where a rule requires such a reference, a recorded one satisfies that rule and no exception
    is raised — provided it is the kind the rule asks for: a pre-approval for TECH-02, a VP approval for
    ENT-01, a manager approval for TECH-04, a baggage-delay reference for the PERS-01 and PERS-02 carve-outs.
    A reference does not waive any other rule.'
  notes: 'Reference waives nothing else. Data: every ref is PA- (pre-approval kind).'
  status: DRAFT
- rule_id: EXC-03
  policy_doc: approval-and-exception-handling.md
  severity: review_signal
  scope: line_items
  triggers:
  - item.confidence < CONF_THRESHOLD
  required_fields:
  - line_items[].confidence
  thresholds:
  - value: unspecified
    unit: classifier confidence
    basis: per item
  carve_outs:
  - condition: non-itemized charge is `other`, never uncertain
    reference_kind: null
  replaces: []
  literal_text: 'EXC-03 — Uncertainty. Where the category of an item cannot be determined with sufficient
    confidence, raise a review signal with rule ID `EXC-03` rather than an exception, and leave that item
    out of every other rule''s calculation for the receipt. A non-itemized charge is not an uncertain
    category: it is `other` by definition, and raises no EXC-03 signal. An unnecessary exception costs
    a reviewer''s time and erodes trust in the system; a missed review costs far less than a false accusation
    against an employee.'
  notes: Uncertain line excluded from every other rule on the receipt.
  status: DRAFT
- rule_id: EXC-04
  policy_doc: approval-and-exception-handling.md
  severity: none
  scope: none
  triggers:
  - every exception emitted
  required_fields:
  - rule_id
  - policy_doc
  - line_ids
  thresholds: []
  carve_outs: []
  replaces: []
  literal_text: EXC-04 — Evidence. Every exception must cite the rule identifier, the policy document
    it comes from, and the line items it concerns. An exception that cannot name its evidence must not
    be raised.
  notes: 'Item rules: line_ids = offending lines, never service_fee. Receipt rules: line_ids = []. One
    per rule per receipt.'
  status: DRAFT
- rule_id: GIFT-01
  policy_doc: gifts-and-awards-policy.md
  severity: medium
  scope: line_items
  triggers:
  - is_gift(line) := type == "Client Gifts" or line names a recipient
  - sum(amount_usd of gift lines with same recipient) > 50
  - is_gift(line) and line.amount_usd >= 10 and recipient unnamed
  required_fields:
  - submitted_expense_type
  - line_items[].description_raw
  - line_items[].amount_usd
  - line_items[].category
  thresholds:
  - value: 50
    unit: USD
    basis: per recipient per receipt (occasion)
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  - value: 10
    unit: USD
    basis: per line, named-recipient test
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  carve_outs:
  - condition: cards and small tokens under $10 need no named recipient
    reference_kind: null
  - condition: gift cards and cash equivalents go to GIFT-02 alone
    reference_kind: null
  - condition: food, drink and gratuities consumed at a meal are not gifts
    reference_kind: null
  replaces: []
  literal_text: GIFT-01 — Client gift cap. Gifts to clients and prospects are capped at $50 per recipient
    per occasion. An occasion is one receipt; lines on it that name the same recipient are added together
    for the cap, and the $10 test applies to each line. Spend above the cap is a medium exception. Any
    gift of $10 or more must also name its recipient, in the line description or elsewhere on the expense;
    an unnamed gift at that value is a medium exception. Cards and small tokens under $10 need no named
    recipient. Gift cards and other cash equivalents fall under GIFT-02 alone and are not also tested
    here. Unnamed gifts are each tested on their own, and when both parts of GIFT-01 apply, one exception
    cites every line involved.
  notes: ''
  status: DRAFT
- rule_id: GIFT-02
  policy_doc: gifts-and-awards-policy.md
  severity: high
  scope: line_items
  triggers:
  - line.category == gift_card
  required_fields:
  - line_items[].category
  thresholds: []
  carve_outs: []
  replaces:
  - GIFT-01
  literal_text: GIFT-02 — Gift cards and cash equivalents. Gift cards, prepaid cards, vouchers, and any
    other cash equivalent are never reimbursable, at any amount and for any recipient. This is a high
    exception.
  notes: gift_card lines skip GIFT-01.
  status: DRAFT
- rule_id: GIFT-03
  policy_doc: gifts-and-awards-policy.md
  severity: medium
  scope: line_items
  triggers:
  - line is an employee recognition gift or award
  required_fields:
  - line_items[].description_raw
  - line_items[].category
  thresholds: []
  carve_outs: []
  replaces: []
  literal_text: GIFT-03 — Employee gifts and awards. Recognition gifts for employees must be processed
    through HR and are not reimbursable on an expense report. This is a medium exception.
  notes: ''
  status: DRAFT
- rule_id: GIFT-04
  policy_doc: gifts-and-awards-policy.md
  severity: critical
  scope: line_items
  triggers:
  - line provided to recipient in {government official, public employee, SOE employee}
  required_fields:
  - line_items[].description_raw
  thresholds:
  - value: 0
    unit: USD
    basis: any amount
  carve_outs:
  - condition: gratuity lines are never cited (EXC-04)
    reference_kind: null
  replaces:
  - GIFT-01
  literal_text: GIFT-04 — Government officials. Gifts, meals, or anything of value provided to a government
    official, public employee, or state-owned enterprise employee are prohibited under our anti-corruption
    policy, at any amount. The exception cites every line provided to the official — including a meal
    line that also covers the employee's own meal, but not a gratuity (EXC-04) — and replaces GIFT-01
    for those lines. Other rules, such as the meal cap, still apply to the receipt. This is a critical
    exception and is routed to Compliance immediately, never to the standard audit queue.
  notes: line_ids include the official's meal line (employee share too), never service_fee. Meal caps
    still evaluated.
  status: DRAFT
- rule_id: ALC-01
  policy_doc: meals-and-entertainment-policy.md
  severity: high
  scope: line_items
  triggers:
  - line.category == alcohol and mcc in {5812, 5813, 7011} and not (type == "Client Entertainment" and
    attendee_count >= 2)
  required_fields:
  - mcc
  - submitted_expense_type
  - attendee_count
  - line_items[].category
  thresholds:
  - value: 2
    unit: attendees
    basis: minimum attendee count, including the employee
  carve_outs:
  - condition: declared Client Entertainment with attendee_count >= 2
    reference_kind: null
  replaces: []
  literal_text: ALC-01 — Alcohol requires a documented entertainment context. Alcohol is reimbursable
    only on a receipt declared as Client Entertainment that records an attendee count of two or more.
    Alcohol on any other receipt — an individual or team meal, or any receipt without an attendee count
    — is a high exception.
  notes: ''
  status: DRAFT
- rule_id: ALC-02
  policy_doc: meals-and-entertainment-policy.md
  severity: medium
  scope: line_items
  triggers:
  - ALC-01 satisfied and sum(alcohol amount_usd) / attendee_count > 30
  required_fields:
  - attendee_count
  - line_items[].category
  - line_items[].amount_usd
  thresholds:
  - value: 30
    unit: USD
    basis: per attendee, alcohol lines only
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  carve_outs: []
  replaces: []
  literal_text: 'ALC-02 — Alcohol per-attendee cap. Where alcohol is permitted under ALC-01, it is capped
    at $30 per attendee: the USD total of the alcohol lines, divided by the attendee count. Spend above
    that cap is a medium exception.'
  notes: ''
  status: DRAFT
- rule_id: ALC-03
  policy_doc: meals-and-entertainment-policy.md
  severity: high
  scope: line_items
  triggers:
  - line.category == alcohol and mcc not in {5812, 5813, 7011}
  required_fields:
  - mcc

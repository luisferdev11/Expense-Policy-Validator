- rule_id: TIME-01
  policy_doc: transaction-pattern-rules.md
  severity: review_signal
  scope: receipt
  triggers:
  - time(transaction_datetime) in [00:00, 05:00)
  required_fields:
  - transaction_datetime
  thresholds:
  - value: 00:00-05:00
    unit: local time
    basis: half-open interval
  carve_outs: []
  replaces: []
  literal_text: TIME-01 — Overnight transactions. A transaction timed from 00:00 up to, but not including,
    05:00 raises a review signal. Transaction times are recorded in local time at the merchant.
  notes: ''
  status: DRAFT
- rule_id: TIME-02
  policy_doc: transaction-pattern-rules.md
  severity: review_signal
  scope: receipt
  triggers:
  - type in {Meals - Individual, Lodging, Travel - Other} and trip_id is null
  required_fields:
  - submitted_expense_type
  - trip_id
  thresholds: []
  carve_outs:
  - condition: team meals and client entertainment are not covered
    reference_kind: null
  replaces: []
  literal_text: TIME-02 — No associated trip. An individual travel expense — declared as Meals - Individual,
    Lodging, or Travel - Other — with no associated trip record raises a review signal. Team meals and
    client entertainment often happen without travel and are not covered.
  notes: ''
  status: DRAFT
- rule_id: TIME-03
  policy_doc: transaction-pattern-rules.md
  severity: high
  scope: receipt
  triggers:
  - group := receipts by (employee_id, merchant_name, date), size >= 2; each <= threshold and sum > threshold
  required_fields:
  - employee_id
  - merchant_name
  - transaction_datetime
  - itemized
  - total_amount_usd
  - attendee_count
  - line_items[].amount_usd
  thresholds:
  - value: 75
    unit: USD
    basis: itemization threshold, all receipts non-itemized (DOC-01)
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  - value: employee meal cap
    unit: USD per person
    basis: MEAL-01, REG-02 or REG-03
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  - value: 50
    unit: USD
    basis: gift cap for one recipient (GIFT-01)
    conversion: converted to USD with fx_rate_to_usd on the receipt (REG-05)
  carve_outs: []
  replaces:
  - DOC-01
  - MEAL-01
  - REG-02
  - REG-03
  - GIFT-01
  literal_text: 'TIME-03 — Split transactions. Two or more receipts by the same employee, at the same
    merchant (by merchant name), on the same calendar date, are treated as a deliberate split when each
    one is at or below one of these thresholds but together they are above it: the $75 itemization threshold,
    when every receipt in the group is non-itemized (DOC-01); the employee''s meal cap, compared per person
    (MEAL-01, REG-02, REG-03); or the $50 gift cap for one recipient (GIFT-01). This is an exception,
    at high severity, and applies to every receipt in the group. It replaces the threshold rule being
    split around: report the split, not a separate breach of that threshold.'
  notes: Out of scoring scope. Emit on every receipt of the group; replaces only the split-around threshold.
  status: DRAFT
- rule_id: TIME-04
  policy_doc: transaction-pattern-rules.md
  severity: review_signal
  scope: receipt
  triggers:
  - weekend date outside trip start/end (needs trip dates)
  required_fields:
  - transaction_datetime
  - trip_id
  thresholds: []
  carve_outs:
  - condition: requires trip start/end dates; absent in data -> never fires
    reference_kind: null
  replaces: []
  literal_text: TIME-04 — Weekend spend on a weekday trip. A transaction dated on a weekend that falls
    outside the trip's recorded start and end dates raises a review signal. It applies only when the trip
    record includes those dates; where there is no trip record at all, TIME-02 covers it.
  notes: ''
  status: DRAFT

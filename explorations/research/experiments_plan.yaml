# Classification experiments, planned before running. One factor at a time, on the synthetic dev
# set, never on the 28 receipts. The decision rule is fixed here, before any result is seen.
#
# Default decision rule (unless an experiment states its own):
#   Adopt variant B over the current baseline A only if, on the same dev items,
#   (1) McNemar exact two-sided p < 0.05 on correctness, AND
#   (2) the accuracy gain is at least the minimum detectable difference at that N
#       (unpaired, alpha 0.05, power 0.8; 0.118 at N=109 around 95 % accuracy), AND
#   (3) restricted F1 does not drop.
#   Otherwise keep the cheaper variant (cost per 1,000 items, then median latency).
# Report every comparison with its N, Wilson intervals and the McNemar b/c counts.
#
# Status: planned unless stated. Runner: explorations/lib/run_trial.py (one model per call);
# classifiers: explorations/lib/decision_adapters.py. Since 2026-10-08 every run goes through
# OpenRouter only; earlier multi-provider results are in explorations/archive/.

prerequisites:
  - id: P0
    what: Luis verifies the DRAFT labels (start with the 8 marked debatable) and freezes a new SHA-256.
  - id: P1
    what: >-
      Harden the dev set. Package 6 showed every API model between 91.7 % and 99.1 % with
      overlapping intervals: the set does not separate models. Add boundary items, receipt-style
      noise (abbreviations, truncation, SKU codes, ALL CAPS, typos), more Japanese and Portuguese,
      and items whose label needs the merchant or MCC. Labels written or reviewed by Luis, not by
      the assistant that also drafts prompts.
  - id: P2
    what: >-
      Split the dev set into a prompt-development part (few-shot examples, prompt edits) and a
      decision part that no prompt ever sees, so few-shot experiments cannot leak.

experiments:
  - id: E1
    factor: model size
    variants: [openai/gpt-oss-120b, openai/gpt-oss-20b]
    held_fixed: provider DeepInfra, prompt cls-v1, reasoning low
    question: Does the 6x smaller model lose accuracy on traps and non-English items?
    status: preliminary result exists (package 6, DRAFT labels); rerun on the hardened set.

  - id: E2
    factor: provider for the same model
    variants: [groq, deepinfra]
    held_fixed: gpt-oss-120b, prompt cls-v1
    question: Do providers serving the same weights agree item by item, and is either better?
    decision_rule: Report agreement and McNemar; pin the cheaper provider unless rule (1)-(3) favours the other.
    status: >-
      Preliminary results. Groq vs DeepInfra agree on 97.2 % (120b) and 96.3 % (20b) of items;
      OpenRouter pinned to DeepInfra bf16 vs DeepInfra direct agree on 98.2 % (120b) and 99.1 %
      (20b): even the same endpoint is not identical, which E11 explains.

  - id: E3
    factor: reasoning effort
    variants: [low, medium]
    held_fixed: gpt-oss-120b on the pinned provider
    question: Does more reasoning fix the boundary items, and at what token cost?

  - id: E4
    factor: input context
    variants: [item text only, item + merchant + MCC]
    question: >-
      How much do merchant and MCC help? Never the declared expense type or attendee count
      (project rule 8).

  - id: E5
    factor: translation
    variants: [classify the original text, translate to English first then classify]
    question: Does a translation step help Japanese and Portuguese items, or only add cost and a second failure point?

  - id: E6
    factor: prompt
    variants: [taxonomy only, taxonomy + names-lie rules (cls-v1), cls-v1 + few-shot examples from the prompt-development split]
    question: Which part of the prompt carries the trap accuracy?
    needs: prompt versions in classifier_prompt.py (cls-v0, cls-v2) and P2.

  - id: E7
    factor: confidence source and EXC-03 threshold
    variants:
      - self-reported confidence from the chat model
      - agreement between gpt-oss-120b and gpt-oss-20b (two calls)
      - probability distribution from a decision model (E8)
    metrics: [Brier score, ECE (10 bins), reliability diagram, coverage vs accuracy curve]
    question: Which signal best separates right from wrong answers, and which threshold sends the fewest correct items to review?
    decision_rule: Choose the signal with the lowest Brier score; set the EXC-03 threshold on the decision split and report how often it fires.

  - id: E8
    factor: decision models as challengers
    variants:
      - typesafe:jev-latest (native API; needs TYPESAFE_API_KEY and access off the waitlist)
      - openrouter:typesafe/jev-1.13 (alpha decisions endpoint; needs the renewed OpenRouter key)
      - openai:decisions-preview (limited preview; schema and price not public yet)
      - local:gliner2.5-decide (open weights, 340M; serve locally)
    question: >-
      Does a model that returns a probability distribution instead of text match gpt-oss on
      accuracy, and are its probabilities better calibrated? Also: is it deterministic (repeat
      the run and compare, since jev is reported to vary between calls)?
    status: scaffolding ready (decision_adapters.py, budget.call_http, run_trial.py routing). Not run; no keys.
    before_first_call: >-
      Verify the request and response schema against the provider's docs, set `verified: true`,
      add an official price to budget.PRICES (calls are refused until then), and add the key to
      .env.

  - id: E9
    factor: keyword baseline (required by the brief)
    variants: [keyword matcher over restricted words, best LLM variant]
    question: Where does keyword matching win, and where do the traps break it?
    needs: a deterministic keyword classifier; no model call.

  - id: E10
    factor: non-generative baseline
    variants: [embedding nearest-neighbour over the prompt-development split (in memory, no vector database), best LLM variant]
    question: How far does a cheap embedding classifier get, and on which categories?

  - id: E11
    factor: determinism and repeatability
    variants: [same model, same input, three runs with the cache disabled]
    question: Is the output byte-identical at temperature 0 on each provider? Feeds the reproducibility rule.
    status: >-
      First result (2026-10-08, OpenRouter pinned to DeepInfra, gpt-oss-120b, 20 items x 2
      repeats): category identical 40/40, raw content byte-identical 36/40. Output is not
      byte-deterministic at temperature 0, so the per-item cache is what makes the pipeline
      reproducible; the confidence feeding EXC-03 must come from the cached response.

  - id: E12
    factor: self-consistency
    variants: [single call, majority of three gpt-oss-20b calls]
    question: Does a cheap ensemble beat one 120b call on cost per correct item?

  - id: E13
    factor: model, all through OpenRouter (generative models with a strict JSON schema, and decision models)
    registered_at: "2026-10-09T02:05:34+00:00"   # written before any of these runs
    variants:
      chat: [openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.5-9b, google/gemma-3-12b-it,
             google/gemma-3-4b-it, mistralai/ministral-8b-2512, mistralai/mistral-nemo,
             ibm-granite/granite-4.2-8b, anthropic/claude-haiku-5.5, openai/gpt-6-luna]
      decision: [typesafe/jev-1.13, openai/gpt-6-luna-decisions, cloudflare/clef-flash,
                 cloudflare/clef, liquid/d1]
    held_fixed: >-
      109 DRAFT dev items (SHA-256 2565118c...3ecb); temperature 0; one pinned endpoint per chat
      model (research/openrouter_pins.json: highest precision, then cheapest, no fallbacks);
      prompt cls-v1 for chat models (reasoning effort low where supported), dec-v1 for decision
      models (same category descriptions and "names lie" rules). Input: item text, merchant,
      MCC; never the declared expense type or attendee count.
    note: >-
      Haiku is included as a normal candidate by Luis's decision, although the team had asked
      not to use Anthropic models; the report must say so.
    question: >-
      Which model should the pipeline's item classifier use, and which confidence signal should
      drive the EXC-03 threshold?
    decision_rule: >-
      (1) Exclude any model with a schema-valid rate below 0.98 or an error rate above 2 %.
      (2) Reference: openai/gpt-oss-120b (the current choice). A challenger replaces it only if
      McNemar exact p < 0.05 in its favour on correctness and its restricted F1 is not lower.
      Otherwise, among models not significantly worse than the reference (McNemar p >= 0.05, or
      better), choose the cheapest per 1,000 items, then the lowest median latency.
      (3) EXC-03 confidence source: the lowest Brier score (top-label confidence vs correctness)
      among non-excluded models; report ECE and a reliability table with bin counts.
      (4) The labels are DRAFT and the set saturated earlier models, so the outcome is
      PRELIMINARY and must be re-run on the hardened, Luis-reviewed dev set before it is final.
    status: >-
      Run 2026-10-09 (15 models x 109 items, no model errors). The registered rule, applied
      mechanically, chose mistralai/mistral-nemo: no challenger beat the reference, and the rule
      then picks the cheapest model that is "not significantly worse". That exposed a flaw in
      the rule: with N=109 McNemar has little power, so "not significantly worse" admitted
      clearly weaker models (granite-4.2-8b at 89 % had p=0.057). The result is reported as
      registered, not overridden; the corrected rule is E14. Lowest Brier: qwen/qwen3.5-9b, but
      all its confidences fall in one bin, so its calibration is barely measurable here.
      Details: notebooks/05_model_trial.ipynb, results/05_results.json.
    deviations:   # added after registration, before the full run; the registered text above is unchanged
      - >-
        2026-10-09: the pinned endpoints of anthropic/claude-haiku-5.5 (google-vertex/global) and
        openai/gpt-6-luna (openai) do not accept `temperature`; with require_parameters the call
        returns 404. For these two models temperature is not sent (provider default). Every other
        model runs at temperature 0. Found on a one-item probe per model.
      - >-
        Transient provider errors (HTTP 429, 5xx) after retries are re-attempted on a later pass
        instead of being counted as model errors; the exclusion rule (1) counts only errors that
        come from the model's answer (invalid or empty output).
      - >-
        2026-10-09, after 6 items: qwen/qwen3.5-9b with reasoning effort "low" spent the whole
        1,024-token budget on reasoning and returned empty answers (finish_reason length) on 3
        of 6 items. That is a configuration failure, not the model's answer, so the model runs
        with reasoning disabled (as in the earlier direct-provider trial) under cache tag
        cls-v1+reasoning-off; the 6 truncated rows were discarded (their calls stay in the
        budget log). No other model's settings changed.

  - id: E14
    factor: item classifier choice, with a non-inferiority margin (replaces E13's step 3)
    registered_at: "2026-10-09T02:20:37+00:00"   # written after E13's flaw was found and before any run on the hardened set
    data: >-
      The hardened, Luis-reviewed dev set, decision split only (the prompt-development split is
      never scored). Same models, settings and pins as E13, unless a model is retired.
    decision_rule: >-
      (1) Same exclusions as E13. (2) Superiority: a challenger becomes the reference if McNemar
      exact p < 0.05 in its favour AND the lower bound of the 95 % paired bootstrap interval of
      its accuracy difference against the reference is above 0. (3) Non-inferiority: a model is
      "as good as" the reference only if that lower bound is above -0.02 (delta = 2 accuracy
      points) AND its restricted F1 is at least the reference's minus 0.01. Bootstrap: 10,000
      paired resamples of items, fixed seed. (4) Among the reference and the non-inferior models,
      choose the cheapest per 1,000 items, then the lowest median latency. (5) EXC-03 confidence
      source: lowest Brier score, reported only if at least three confidence bins hold 10 or more
      items each; otherwise state that calibration could not be measured.
    why_delta: >-
      With about 2.5 items per receipt, a 2-point drop in item accuracy puts a misread item on
      roughly 5 % more receipts, the most the review queue can absorb without hiding real
      violations. The margin is chosen before seeing the hardened-set results.
    status: registered, not yet run (waits for the hardened dev set)

# Iteration 2 registrations (specs/002-decide-on-dev). Drafted by the assistant on 2026-10-09,
# BEFORE any run on the frozen dev set. Each takes effect only once Luis sets approved_by and the
# frozen set's SHA-256 is written into data. eval/experiments/run_dev.py refuses otherwise.
iteration_2:
  - id: E14
    amends: E14 above, before its first run
    amendment_reason: >-
      Prompt cls-v1 became cls-v2 (subtype A6, recipient A9), so decision models (no subtype or
      recipient) and Anthropic models (team request) leave the candidate set. All 130 frozen items
      decide, because cls-v2 is frozen for the iteration and no item develops prompts (Luis,
      2026-10-09 clarification). The decision rule of E14 above is kept unchanged otherwise.
    factor: item classifier model
    variants: [gpt-oss-120b, gpt-oss-20b, qwen3.5-9b, gemma-3-12b]
    reference: gpt-oss-120b
    held_fixed: prompt cls-v2, OpenRouter routing with the serving provider recorded, temperature 0, strict parser
    amendment_2: >-
      2026-10-09, before any accuracy was computed: DeepInfra rate-limited gemma-3-12b, so the
      deepinfra/bf16 pin became OpenRouter routing (ADR 0004). All four models re-run under it;
      the DeepInfra runs decide nothing. Approved by Luis.
    metrics: >-
      Category accuracy (primary) with Wilson intervals; restricted F1; subtype and recipient-kind
      accuracy on the items that exercise A6/A9; McNemar exact b/c; paired bootstrap of the
      accuracy difference (10,000 resamples, seed 20261009); cost per 1,000 items; median latency.
    decision_rule: >-
      As E14 above: superiority if McNemar p < 0.05 in the challenger's favour AND the bootstrap
      lower bound is > 0; non-inferiority if the lower bound is > -0.02 AND restricted F1 is at
      least the reference's minus 0.01 AND, added here, the challenger gets at most 2 more of the
      A6/A9 items wrong (subtype or recipient kind) than the reference. Among the reference and
      the non-inferior or superior models, choose the cheapest per 1,000 items, then the lowest
      median latency. A model with schema violations on more than 2 % of items is excluded. If
      no challenger qualifies, keep the reference.
    approved_by: Luis
    registered_at: "2026-10-09"
    data: "5f34f08ec59f487c9483378cfe3e0a4904f9985086d677b7c619ce210fe000a7"
  - id: E7
    factor: EXC-03 confidence source and threshold
    variants: [self_reported, agreement_120b_20b]
    held_fixed: the E14 winner's cls-v2 answers on the frozen set; no new calls
    metrics: Brier score, ECE (10 bins), coverage-accuracy curve, N per bin
    decision_rule: >-
      (1) Choose the source with the lower Brier score. If self-reported confidence fills fewer
      than three bins with at least 10 items each, report that calibration could not be measured
      for it. (2) Threshold for self-reported confidence: among candidate thresholds (every
      distinct confidence, plus 0), keep only those that send at most 10 % of the correct items
      to review; pick the one with the highest accuracy on the items kept; ties go to the lower
      threshold. A threshold of 0 (EXC-03 only for unusable answers) is a valid outcome. (3) For
      agreement, EXC-03 fires when the two models disagree; it is adopted only if it wins (1), and
      its cost of a second call per item is reported.
    approved_by: Luis
    registered_at: "2026-10-09"
    data: "5f34f08ec59f487c9483378cfe3e0a4904f9985086d677b7c619ce210fe000a7"
  - id: E5
    factor: translation before classification
    variants: [original, translate]
    held_fixed: reference pin gpt-oss-120b, cls-v2, prompt tr-v1 for translation
    data_scope: the non-English items of the frozen set only (Luis, 2026-10-09 clarification)
    decision_rule: >-
      Translate wins only if McNemar exact p < 0.05 in its favour AND the paired bootstrap lower
      bound of its category-accuracy gain is > 0 on those items. Otherwise keep the original
      text, which is simpler and needs no second call. Report the minimum detectable difference
      at that N.
    approved_by: Luis
    registered_at: "2026-10-09"
    data: "5f34f08ec59f487c9483378cfe3e0a4904f9985086d677b7c619ce210fe000a7"
  - id: E15
    factor: reading "subtype" null as "none"
    variants: [strict, null_as_none]
    held_fixed: the cached literal answers of every E14 run on the frozen set; no new calls
    decision_rule: >-
      Adopt null_as_none only if, re-parsing those cached answers, it turns at least one
      unclassified item into a correctly classified one AND turns no item into a wrong
      classification. If no null subtype occurs on the dev set, keep strict and report that the
      case was not observed on dev (the scored receipts are not used to decide).
    approved_by: Luis
    registered_at: "2026-10-09"
    data: "5f34f08ec59f487c9483378cfe3e0a4904f9985086d677b7c619ce210fe000a7"
  - id: RET
    factor: policy retriever
    variants: [trigger_map, all_rules]
    held_fixed: the engine, the 13 engine fixtures, synthetic unit receipts, and the 32 receipts'
      committed classifications (inputs and cached outputs only, never answers)
    decision_rule: >-
      Keep the trigger map if the engine's findings are identical under both variants on every
      case; it is cheaper to explain. Any difference is a bug in the trigger map: fix it and
      re-run, never adopt the difference silently.
    approved_by: Luis
    registered_at: "2026-10-09"
    data: "5f34f08ec59f487c9483378cfe3e0a4904f9985086d677b7c619ce210fe000a7"
  # E16 (specs/007-jev-classifier/contracts/e16-rule.md). Registered on 2026-10-12 before any
  # E16 run, after the demonstrative jev-1.13 run of 2026-10-11 whose numbers are known. Luis
  # approved the rule text in conversation on 2026-10-12; a change to it needs a new approval.
  - id: E16
    factor: item classifier, a decision model for the category
    registered_at: "2026-10-12T19:30:31+00:00"
    variants: [jev-1.13, jev-hybrid]
    reference: gpt-oss-120b   # its committed E14 answers on this set; no new call
    held_fixed: >-
      Frozen dev set (all 130 items decide). Decision prompt dec-v1 (the E13 payload, moved into
      the package unchanged); cls-v2 for gpt-oss-120b, whose answers are the committed E14 cache
      (explorations/results/iter2/cache/gpt-oss-120b.jsonl), so the hybrid's detail side makes no
      new call. OpenRouter routing; serving provider recorded. Input: item text, merchant, MCC;
      never the declared expense type or attendee count.
    why: >-
      On 2026-10-11 jev-1.13 classified 130/130 categories (gpt-oss-120b 123/130, McNemar b=7 c=0
      p=0.0156) but returns no subtype or recipient (A6/A9 wrong 23/29). That run was not
      registered. The hybrid takes jev's category and confidence and gpt-oss-120b's subtype and
      recipient.
    metrics: >-
      Category accuracy (primary) with Wilson intervals; restricted F1; A6/A9 items wrong (subtype
      or recipient kind) out of those that exercise A6/A9; schema-violation rate; McNemar exact b/c;
      paired bootstrap of the accuracy difference (10,000 resamples, seed 20261012); cost per
      1,000 items (both calls for the hybrid); median and p95 latency per item (both calls for the
      hybrid); Brier and ECE of each confidence source.
    decision_rule: >-
      Applied in this order, per challenger. (1) Exclusion: schema violations on more than 2 % of
      items. (2) A6/A9 guard: more than 2 more A6/A9 items wrong than the reference fails the
      challenger, whatever its accuracy ("fails_a6a9_guard"). (3) Restricted guard: restricted F1
      below the reference's minus 0.01 fails it ("fails_restricted_guard"). (4) Superiority:
      McNemar exact p < 0.05 in the challenger's favour AND the bootstrap lower bound of its
      accuracy difference > 0. (5) Non-inferiority: bootstrap lower bound > -0.02. Winner: if any
      challenger is superior, the cheapest superior challenger wins (the reference is not
      eligible). Otherwise, the cheapest among the reference and the non-inferior challengers;
      ties go to the lower median latency, then the name. If nothing qualifies, keep the
      reference.
    threshold_rule: >-
      If a jev variant wins, its EXC-03 confidence source and threshold are chosen with E7's
      registered procedure on the winner's answers (lowest Brier among the sources
      top_probability and reported confidence, reported only if at least three bins hold 10 or
      more items; threshold: among every distinct confidence plus 0, keep those that send at most
      10 % of correct items to review, pick the highest accuracy on the kept items, ties to the
      lower threshold). A threshold of 0 is a valid outcome and is reported with the dev items it
      would send to review (k/N).
    repeatability: >-
      Before scoring, the 130 jev answers are requested once and cached; a second uncached pass on
      a random 20-item subset (seed 20261012) measures how often the category changes between
      calls (k/20). It is reported, it decides nothing, and its calls count in the budget.
    budget: USD 0.10 for the whole experiment (jev about USD 0.006 per pass of 130 items).
    data: "5f34f08ec59f487c9483378cfe3e0a4904f9985086d677b7c619ce210fe000a7"
    approved_by: Luis   # approved in conversation on 2026-10-12, before any E16 run

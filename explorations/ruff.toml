# Exploration code is throwaway research, held to a looser standard than src/: long data rows,
# imports after sys.path setup, and non-ASCII text in multilingual examples are expected here.
extend = "../pyproject.toml"
# Executed notebooks are generated from notebooks/src/; lint the sources, not the outputs.
extend-exclude = ["*.ipynb"]

[lint]
extend-ignore = [
    "B905",   # zip() without strict= in short analysis loops
    "B018",   # a bare expression at the end of a notebook cell is its displayed output
    "E402",   # imports after sys.path.insert
    "E501",   # long literal rows (dev items, prices)
    "RUF001", # ambiguous unicode in strings (multilingual items, ×, –)
    "RUF002",
    "RUF003",
    "B023",
    "SIM108",
]
